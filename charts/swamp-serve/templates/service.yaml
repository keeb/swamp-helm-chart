apiVersion: v1
kind: Service
metadata:
  name: {{ include "swamp-serve.fullname" . }}
  labels:
    {{- include "swamp-serve.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "swamp-serve.selectorLabels" . | nindent 4 }}
  ports:
    - name: serve
      port: {{ .Values.service.port }}
      targetPort: serve
      protocol: TCP
      {{- if and .Values.service.nodePort (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
