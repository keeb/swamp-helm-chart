{{- include "swamp-serve.validate" . -}}
{{- /*
Trusted hosts for swamp's off-loopback Host-header (DNS-rebinding) defense.
The WebSocket API rejects upgrades whose Host is not trusted, so when an ingress
fronts the service its hostnames must be whitelisted or real WS clients get a
403 "untrusted host". Ingress hosts are merged in automatically.
*/ -}}
{{- $trusted := .Values.serve.trustedHosts | default (list) -}}
{{- if .Values.ingress.enabled -}}
{{- $trusted = concat $trusted .Values.ingress.hosts -}}
{{- /* server-alias hosts (comma-separated) must be trusted too */ -}}
{{- $alias := index (.Values.ingress.annotations | default dict) "nginx.ingress.kubernetes.io/server-alias" -}}
{{- if $alias -}}
{{- range (splitList "," $alias) -}}
{{- $trusted = append $trusted (trim .) -}}
{{- end -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swamp-serve.fullname" . }}
  labels:
    {{- include "swamp-serve.labels" . | nindent 4 }}
spec:
  # swamp serve holds a local datastore; keep it single-writer.
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "swamp-serve.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swamp-serve.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if and .Values.tls.enabled (not .Values.tls.existingSecret) }}
        # Roll pods when the generated cert changes.
        checksum/tls: {{ include (print $.Template.BasePath "/tls-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.swampAuth.apiKey (not .Values.swampAuth.existingSecret) }}
        # Roll pods when the inline API key changes.
        checksum/auth: {{ include (print $.Template.BasePath "/auth-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "swamp-serve.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: repo-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # Runs the image's entrypoint in prep-only mode (no args => prepare the
          # repo and exit 0), so init logic lives in exactly one place:
          # docker/entrypoint.sh. It is idempotent against a durable repo volume:
          # it initializes only when the marker is absent and otherwise runs
          # `swamp repo upgrade`, which preserves the repoId that `repo init
          # --force` would regenerate (breaking datastore namespace ownership).
          command:
            - /usr/local/bin/entrypoint.sh
          args: []
          env:
            - name: SWAMP_REPO_DIR
              value: {{ .Values.serve.repoDir | quote }}
            {{- if .Values.serve.vault.ensure }}
            # token mode stores minted token secrets here; oauth mode stores
            # the registered OAuth client credentials here.
            - name: SWAMP_INIT_VAULT
              value: {{ .Values.serve.vault.name | quote }}
            - name: SWAMP_INIT_VAULT_TYPE
              value: {{ .Values.serve.vault.type | quote }}
            {{- else }}
            - name: SWAMP_INIT_VAULT
              value: ""
            {{- end }}
            {{- include "swamp-serve.env" . | nindent 12 }}
          volumeMounts:
            - name: home
              mountPath: /home/swamp
            - name: repo
              mountPath: {{ .Values.serve.repoDir }}
      containers:
        - name: serve
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - swamp
            - serve
          args:
            - "--repo-dir={{ .Values.serve.repoDir }}"
            - "--host={{ .Values.serve.host }}"
            - "--port={{ .Values.serve.port }}"
            - "--no-telemetry"
            {{- if .Values.serve.noSchedule }}
            - "--no-schedule"
            {{- end }}
            {{- if ne .Values.serve.authMode "none" }}
            - "--auth-mode={{ .Values.serve.authMode }}"
            {{- end }}
            {{- if .Values.serve.admins }}
            - "--admins={{ join "," .Values.serve.admins }}"
            {{- end }}
            {{- if eq .Values.serve.authMode "oauth" }}
            {{- with .Values.serve.oauth.allowedCollectives }}
            - "--allowed-collectives={{ join "," . }}"
            {{- end }}
            {{- with .Values.serve.oauth.allowedUsers }}
            - "--allowed-users={{ join "," . }}"
            {{- end }}
            {{- with .Values.serve.oauth.provider }}
            - "--oauth-provider={{ . }}"
            {{- end }}
            {{- with .Values.serve.oauth.clientId }}
            - "--oauth-client-id={{ . }}"
            {{- end }}
            {{- with .Values.serve.oauth.groupsField }}
            - "--groups-field={{ . }}"
            {{- end }}
            {{- with .Values.serve.oauth.groupRefreshInterval }}
            - "--group-refresh-interval={{ . }}"
            {{- end }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - "--cert-file=/tls/tls.crt"
            - "--key-file=/tls/tls.key"
            {{- end }}
            {{- if $trusted }}
            - "--trusted-hosts={{ join "," $trusted }}"
            {{- end }}
            {{- range .Values.serve.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            {{- include "swamp-serve.env" . | nindent 12 }}
          ports:
            - name: serve
              containerPort: {{ .Values.serve.port }}
              protocol: TCP
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /
              port: serve
              scheme: {{ if .Values.tls.enabled }}HTTPS{{ else }}HTTP{{ end }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: serve
              scheme: {{ if .Values.tls.enabled }}HTTPS{{ else }}HTTP{{ end }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /
              port: serve
              scheme: {{ if .Values.tls.enabled }}HTTPS{{ else }}HTTP{{ end }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: home
              mountPath: /home/swamp
            - name: repo
              mountPath: {{ .Values.serve.repoDir }}
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
      volumes:
        - name: home
          {{- if .Values.persistence.home.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "swamp-serve.fullname" . }}-home
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: repo
          {{- if .Values.persistence.repo.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "swamp-serve.fullname" . }}-repo
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ include "swamp-serve.tlsSecretName" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
