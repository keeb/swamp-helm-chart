{{- if and .Values.tls.enabled (not .Values.tls.existingSecret) }}
{{- $cert := "" -}}
{{- $key := "" -}}
{{- if and .Values.tls.cert .Values.tls.key -}}
  {{- $cert = .Values.tls.cert -}}
  {{- $key = .Values.tls.key -}}
{{- else -}}
  {{- $fullname := include "swamp-serve.fullname" . -}}
  {{- $ns := .Release.Namespace -}}
  {{- $altNames := list
        $fullname
        (printf "%s.%s" $fullname $ns)
        (printf "%s.%s.svc" $fullname $ns)
        (printf "%s.%s.svc.cluster.local" $fullname $ns)
        "localhost" -}}
  {{/* Reuse the existing cert across upgrades so it stays stable. */}}
  {{- $existing := lookup "v1" "Secret" $ns (include "swamp-serve.tlsSecretName" .) -}}
  {{- if and $existing $existing.data (index $existing.data "tls.crt") -}}
    {{- $cert = index $existing.data "tls.crt" | b64dec -}}
    {{- $key = index $existing.data "tls.key" | b64dec -}}
  {{- else -}}
    {{- $ca := genCA (printf "%s-ca" $fullname) 3650 -}}
    {{- $signed := genSignedCert $fullname (list "127.0.0.1") $altNames 3650 $ca -}}
    {{- $cert = $signed.Cert -}}
    {{- $key = $signed.Key -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "swamp-serve.tlsSecretName" . }}
  labels:
    {{- include "swamp-serve.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert | b64enc | quote }}
  tls.key: {{ $key | b64enc | quote }}
{{- end }}
