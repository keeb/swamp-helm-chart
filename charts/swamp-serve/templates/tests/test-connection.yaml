apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "swamp-serve.fullname" . }}-test-connection"
  labels:
    {{- include "swamp-serve.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  # Reuse the swamp image (curl is installed) so no extra pull is needed.
  containers:
    - name: probe
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          scheme={{ if .Values.tls.enabled }}https{{ else }}http{{ end }}
          url="${scheme}://{{ include "swamp-serve.fullname" . }}:{{ .Values.service.port }}/"
          echo "Probing health endpoint: ${url}"
          body="$(curl -fsSk --max-time 10 "${url}")"
          echo "Response: ${body}"
          echo "${body}" | grep -q '"status":"ok"'
          echo "OK: swamp serve is healthy"
