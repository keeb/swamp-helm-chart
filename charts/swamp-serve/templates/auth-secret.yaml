{{- /*
Secret carrying the swamp-club API key the server process authenticates with
(`serve:*` scope). Only rendered for an inline swampAuth.apiKey — when
swampAuth.existingSecret is set the chart just references that Secret.
*/ -}}
{{- if and .Values.swampAuth.apiKey (not .Values.swampAuth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "swamp-serve.apiKeySecretName" . }}
  labels:
    {{- include "swamp-serve.labels" . | nindent 4 }}
type: Opaque
data:
  {{ include "swamp-serve.apiKeySecretKey" . }}: {{ .Values.swampAuth.apiKey | b64enc | quote }}
{{- end }}
